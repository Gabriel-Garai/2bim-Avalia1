<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desenho Assinado</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Desenho Assinado</h1>
      <p>Escolha um número entre 1 e 100. O desenho será assinado com o e-mail verificado da sua conta Google.</p>
    </header>
    <section aria-label="Login Google">
      <div id="g_id_onload"
        data-client_id="447041241795-kfsdfpra23e22gle0bs1lslo1p6o5qo4.apps.googleusercontent.com"
        data-callback="handleCredentialResponse"
        data-auto_prompt="false"></div>
      <div class="g_id_signin" data-type="standard" data-size="large" data-locale="pt-BR"></div>
      <p id="login-status" role="status">Entre com sua conta Google antes de desenhar.</p>
    </section>
    <form id="formulario" novalidate>
      <label for="numero">Número</label>
      <input id="numero" name="numero" type="number" min="1" max="100" step="1" required placeholder="62">
      <button id="gerar" type="submit">Desenhar</button>
    </form>
    <p id="mensagem" role="alert"></p>
    <figure id="desenho" aria-live="polite"></figure>
    <button id="baixar" type="button" hidden>Baixar SVG</button>
  </main>
  <script src="script.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
